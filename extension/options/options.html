<!doctype html><meta charset="utf-8"><title>SPS Shield settings</title>
<style>:root{color-scheme:light dark}body{max-width:560px;margin:30px auto;font:15px/1.5 system-ui;padding:0 16px}label{display:block;margin:12px 0}small{display:block;opacity:.7;margin-left:26px}</style>
<h1>🛡 SPS Shield</h1>
<label><input type="checkbox" id="trackers"> Block known trackers and ad networks<small>Only third-party requests. If a site breaks, use "Pause on this site" in the popup.</small></label>
<label><input type="checkbox" id="params"> Remove tracking parts from links (utm_*, fbclid, gclid …)</label>
<label><input type="checkbox" id="privacy"> Privacy hardening<small>Hides your real IP in WebRTC, blocks third-party cookies, turns off link click-tracking pings. Safe Browsing stays ON.</small></label>
<label><input type="checkbox" id="memorySaver"> Memory saver: sleep tabs not used for <input type="number" id="memoryMinutes" min="5" max="600" style="width:70px"> minutes</label>
<p><small style="margin:0">Everything is processed on your computer. SPS Shield collects and sends no data.</small></p>
<script src="options.js"></script>
